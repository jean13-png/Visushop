# To activate: copy this file to .github/workflows/visushop-build.yml on GitHub.
# Debug APK only: do not use the temporary signing key for public releases.
name: VISUSHOP Android debug
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Python image dependency
        run: python3 -m pip install --user pillow
      - name: Compile debug APK
        run: bash build-visushop-debug.sh -tag=v0.20.2
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: visushop-debug-apk
          path: output/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visushop-build-logs
          path: logs/*.log
          if-no-files-found: ignore
          retention-days: 7
